global:
  # seed: 42

chunking:
  strategy: "simple"
  simple:
    chunk_size: 800
    chunk_overlap: 100
  recursive_token:
    chunk_size: 2000
    chunk_overlap: 100
    keep_separator: true
    separators: ["\n\n", "\n", ".", "?", "!", " ", ""]
    is_separator_regex: false
  fixed_token:
    model_name: null
    encoding_name: "cl100k_base"
    chunk_size: 1000
    chunk_overlap: 100
    allowed_special: []
    disallowed_special: "all"
  kamradt_modified:
    avg_chunk_size: 400
    min_chunk_size: 50
  cluster_semantic:
    max_chunk_size: 400
    min_chunk_size: 50
  llm_semantic:
    organisation: "openai"
    model_name: "gpt-4o"
    api_key: null

stage1_corpus:
  mode: "chunked_jsons"           # or "raw_docs"
  input_dir: "./chunked_texts"    # if mode == chunked_jsons
  raw_docs_dir: "./raw_docs"      # if mode == raw_docs
  output_dir: "./artifacts/stage1"  # writes: corpus.jsonl, doc_chunks.json, corpus_id_mapping.json
