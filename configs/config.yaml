global:
  # global defaults if you like (optional)
  # seed: 42

embedding:
  provider: "openai"                         # "openai" or "local"
  openai_model: "text-embedding-3-small"
  local_model: "sentence-transformers/all-MiniLM-L6-v2"
  max_batch: 1024

chunking:
  # used only when stage1 uses raw docs
  strategy: "simple"                         # simple | recursive_token | fixed_token | kamradt_modified | cluster_semantic | llm_semantic
  # override class path if needed (e.g., your package path)
  # class_path: "chunking_evaluation.chunking.recursive:RecursiveTokenChunker"

  simple:
    chunk_size: 800
    chunk_overlap: 100

  recursive_token:
    chunk_size: 2000
    chunk_overlap: 100
    keep_separator: true
    separators: ["\n\n", "\n", ".", "?", "!", " ", ""]
    is_separator_regex: false

  fixed_token:
    model_name: null
    encoding_name: "cl100k_base"
    chunk_size: 1000
    chunk_overlap: 100
    allowed_special: []
    disallowed_special: "all"

  kamradt_modified:
    avg_chunk_size: 400
    min_chunk_size: 50

  cluster_semantic:
    max_chunk_size: 400
    min_chunk_size: 50

  llm_semantic:
    organisation: "openai"                   # "openai" or "anthropic"
    model_name: "gpt-4o"
    api_key: null                            # if null, uses env var

stage1_corpus:
  mode: "chunked_jsons"                      # "chunked_jsons" or "raw_docs"
  input_dir: "./chunked_texts"               # if mode == chunked_jsons
  raw_docs_dir: "./raw_docs"                 # if mode == raw_docs
  output_dir: "./artifacts/stage1"           # writes: corpus.jsonl, doc_chunks.json, corpus_id_mapping.json

stage2_qa:
  qa_csv: "./chunking_evaluation/evaluation_framework/general_evaluation_data/questions_df.csv"
  output_dir: "./artifacts/stage2"           # writes: qa_pairs.json
  # reads: stage1_corpus/corpus_id_mapping.json

stage3_embeddings:
  input_dir: "./artifacts/stage1"            # reads: doc_chunks.json
  output_dir: "./artifacts/stage3"           # writes: chunk_norm.jsonl, chunk_embeddings.jsonl

stage4_match:
  input_corpus_dir: "./artifacts/stage1"     # reads: corpus.jsonl, doc_chunks.json
  input_qa_dir: "./artifacts/stage2"         # reads: qa_pairs.json
  input_embed_dir: "./artifacts/stage3"      # reads: chunk_embeddings.jsonl, chunk_norm.jsonl
  output_dir: "./artifacts/stage4"           # writes: queries.jsonl, qrels.jsonl (corpus.jsonl already from stage1)

  matching:
    window_k: 2

  thresholds:
    cos_strong: 0.72
    cos_med: 0.60
    jaccard_strong: 0.40
    jaccard_med: 0.25
    overlap_strong: 0.90
    overlap_med: 0.30
    overlap_low: 0.10
