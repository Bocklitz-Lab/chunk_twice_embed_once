global:
  # seed: 42

stage4_match:
  input_corpus_dir: "./artifacts/stage1"     # reads: corpus.jsonl, doc_chunks.json
  input_qa_dir: "./artifacts/stage2"         # reads: qa_pairs.json
  input_embed_dir: "./artifacts/stage3"      # reads: chunk_embeddings.jsonl, chunk_norm.jsonl
  output_dir: "./artifacts/stage4"           # writes: queries.jsonl, qrels.jsonl

  matching:
    window_k: 2

  thresholds:
    cos_strong: 0.72
    cos_med: 0.60
    jaccard_strong: 0.40
    jaccard_med: 0.25
    overlap_strong: 0.90
    overlap_med: 0.30
    overlap_low: 0.10
