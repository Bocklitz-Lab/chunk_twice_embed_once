global:
  # seed: 42

embedding:
  provider: "openai"                         # "openai" or "local"
  openai_model: "text-embedding-3-small"
  local_model: "sentence-transformers/all-MiniLM-L6-v2"
  max_batch: 1024

stage3_embeddings:
  input_dir: "./artifacts/stage1"            # reads: doc_chunks.json
  output_dir: "./artifacts/stage3"           # writes: chunk_norm.jsonl, chunk_embeddings.jsonl
