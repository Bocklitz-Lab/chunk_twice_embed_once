#-------------------------------------------------------------------------------------
#                               STAGE 2
#-------------------------------------------------------------------------------------
stage2:
  root_dir: ${params.paths.screen_dir}
  results_subdir: "validation_results"
  split_preference: ["test", "validation", "train"]  # Which split(s) to prefer when extracting nDCG@10 (first match wins)
  metric_key: "ndcg_at_10" 
  top_percent: 0.10   # Keep top X% within each dataset (0–1)
  datasets_include: []   # e.g., ["ChemHotpotQARetrieval", "ChemNQRetrieval"](leave empty to take all found)
  output_union_csv: ${params.paths.screen_dir}/passed_models_union.csv
  output_per_dataset_csv: ${params.paths.screen_dir}/passed_per_dataset.csv
  model_id_format: "name@rev"
  # How to name models in outputs:
  # "name" -> from model_meta.json "name" (e.g., BAAI/bge-base-en-v1.5)
  # "name@rev" -> name + '@' + revision if present
  # "folder" -> use the outer folder name (e.g., BAAI__bge-base-en-v1.5_a5be...)
#-------------------------------------------------------------------------------------
#                               STAGE 3
#-------------------------------------------------------------------------------------
stage3:
  repo_id: "Bocklitz-Lab/ChemQuests"
  data_files: ["metadata.jsonl", "full_text.jsonl", "qa.jsonl"]
  output_dir: ${params.paths.chemquests_dir}
  revision: "main"
  overwrite: false
#-------------------------------------------------------------------------------------
#                               STAGE 4
#-------------------------------------------------------------------------------------
stage4:
  input_path: ${params.paths.chemquests_dir}/full_text.jsonl
  output_path: ${params.paths.chunks_dir}/chunks.jsonl
  text_field: text
  id_field: corpus_id
  token_count_encoding: cl100k_base   # or leave null to skip
  token_count_model: null             # e.g., gpt-4o-mini (tiktoken will map)
  compute_offsets: true
  max_docs: null  # Limit processing during tests
  strategy: ${params.strategy.preset}
#-------------------------------------------------------------------------------------
#                               STAGE 5
#-------------------------------------------------------------------------------------
stage5:
  qa_jsonl_file: ${params.paths.chemquests_dir}/qa.jsonl
  chunks_jsonl_file: ${params.paths.chunks_dir}/chunks.jsonl
  output_folder: ${params.paths.mteb_task_dir}
  search_scope: single        # "single" or "all"
  include_source_flag: true
  ngram_n: 1                  # 1 = unigrams (good recall, simple)
  top_k: 5
  adjacency_window: 1         # neighbor boost ±1
  neighbor_penalty: 0.9
  merge_window: true          # merged neighbor window scoring
  weights:
    bm25: 1.0
    jaccard: 1.0
    fuzzy_token_set: 1.0
#-------------------------------------------------------------------------------------
#                               STAGE 6
#-------------------------------------------------------------------------------------
stage6:
  models:
    - name: ${params.model.name}
      revision: ${params.model.revision}
      batch_size: ${params.model.batch_size}
      normalize: ${params.model.normalize}
      model_kwargs:
        trust_remote_code: true
  tasks:
    # - ChemNQRetrieval # An official MTEB task by name
    - class: pipeline_lib.my_tasks.ChemQuest
      kwargs:
        data_dir: ${params.paths.mteb_task_dir}    
  import_modules:
    - pipeline_lib.my_tasks
  encode_kwargs:
    normalize_embeddings: false
  output_root: ${params.paths.test_results_dir}

