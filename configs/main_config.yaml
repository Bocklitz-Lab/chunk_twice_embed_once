#-------------------------------------------------------------------------------------
#                               STAGE 2
#-------------------------------------------------------------------------------------
stage2:
  root_dir: ${params.paths.screen_dir}
  results_subdir: ${params.paths.phase1_results_subdir}   # the folder stage 1 writes (params.paths.phase1_results_subdir)
  eval_split: ${params.phase1.eval_split}    # task -> split that is scored (no fallback order; a missing split stops stage 2)
  n_queries: ${params.phase1.n_queries}
  metric_key: "geom_mean"
  geom_mean:
    k: 10
    weights:
      ndcg: 1.0
      recall: 1.0
      time: 0.0
    time:
      value_keys: ["evaluation_time"]  
      unit: "seconds"               # or "ms"
      transform: "inverse"          # "inverse" => score = 1 / (1 + (time / reference_seconds))
      reference_seconds: 200.0
  top_percent: ${params.phase1.selection.top_fraction}          # Keep top X% within each dataset (0–1): the published rule, and `top_fraction` of the selection rule
  datasets_include: []       # e.g., ["ChemHotpotQARetrieval", "ChemNQRetrieval"] (leave empty to take all)
  # The shortlist files carry the name of the Phase 1 folder, so the published shortlist (passed_per_dataset.csv, restored from the old
  # artifacts) is never overwritten. The Makefile default MODELS_CSV is output_per_dataset_csv (tests/test_phase1_paths.py checks this).
  output_union_csv: ${params.paths.screen_dir}/passed_models_union__${params.paths.phase1_results_subdir}.csv
  output_per_dataset_csv: ${params.paths.screen_dir}/passed_per_dataset__${params.paths.phase1_results_subdir}.csv
  selection: ${params.phase1.selection}   # rule of the Phase 2 model list (pipeline_lib/shortlist.py)
  seed: ${params.seed}
  output_selection_csv: ${params.paths.screen_dir}/shortlist_selection__${params.paths.phase1_results_subdir}.csv
  model_id_format: "name@rev"
  # How to name models in outputs:
  # "name" -> from model_meta.json "name" (e.g., BAAI/bge-base-en-v1.5)
  # "name@rev" -> name + '@' + revision if present
  # "folder" -> use the outer folder name (e.g., BAAI__bge-base-en-v1.5_a5be...)
#-------------------------------------------------------------------------------------
#                               STAGE 3
#-------------------------------------------------------------------------------------
stage3:
  repo_id: "Bocklitz-Lab/ChemQuests"
  data_files: ["metadata.jsonl", "full_text.jsonl", "qa.jsonl", "qa/question_metadata.jsonl"]   # the pinned release has no full_text.jsonl: it is built from full_text/<id>.txt + metadata.jsonl
  output_dir: ${params.paths.chemquests_dir}
  revision: "5ab7dc673653b800f368fe30851efbdb24385e0d"   # pinned release (never "main")
  qa_sha256: "e66ced49821787f7448b688a261ca0bb65c5cfe0f9961753316aec52c6b20e8d"
  # qa/question_metadata.jsonl (question type, subfields per question) is NOT in the pinned release above; it has its own pin. That dataset commit
  # differs from the release only by this file (qa.jsonl, metadata.jsonl, every full_text/<id>.txt have the same git blob ids).
  question_metadata_revision: "790d2bc6829ccd7e1e480a6a4610149650b79e9f"
  question_metadata_sha256: "4e1f83fbe22323bfd358e95c3814cd39b508d76d67df2680410acc7fb31c5a70"
  overwrite: false
#-------------------------------------------------------------------------------------
#                               STAGE 4
#-------------------------------------------------------------------------------------
stage4:
  input_path: ${params.paths.chemquests_dir}/full_text.jsonl
  output_path: ${params.paths.chunks_dir}/chunks.jsonl
  text_field: text
  id_field: corpus_id
  token_count_encoding: cl100k_base   # or leave null to skip
  token_count_model: null             # e.g., gpt-4o-mini (tiktoken will map)
  compute_offsets: true
  max_docs: null  # Limit processing during tests
  strategy: ${params.strategy.preset}
#-------------------------------------------------------------------------------------
#                               STAGE 5
#-------------------------------------------------------------------------------------
stage5:
  qa_jsonl_file: ${params.paths.chemquests_dir}/qa.jsonl
  full_text_jsonl_file: ${params.paths.chemquests_dir}/full_text.jsonl   # span labels check the chunk and span positions against it
  labeling: ${params.labeling}      # method, cover_level, qrels_file (see params.labeling)
  chunks_jsonl_file: ${params.paths.chunks_dir}/chunks.jsonl
  output_folder: ${params.paths.mteb_task_dir}
  search_scope: single              # "single" or "all"
  include_source_flag: true         # include continuous score in qrels
  ngram_n: 1                        # 1 = unigrams
  adjacency_window: 1               # neighbor boost ±1 chunks
  merge_window: true                # enable neighbor merged scoring
  alpha_neighbor: 0.2               # 0 = ignore neighbors, 1 = use only merged window
  weights:
    bm25: 1.0
    jaccard: 1.0
    fuzzy_token_set: 1.0
  min_score_threshold: 0.95           # keep all chunks with score >= this value
  max_results_per_query: 5          # 0 = no cap; set e.g. 100 to cap
  print_log : false
  embed_chunk_title: ${params.embed_chunk_title}
#-------------------------------------------------------------------------------------
#                               STAGE 6
#-------------------------------------------------------------------------------------
stage6:
  seed: ${params.seed}
  use_prompts: ${params.use_prompts}
  instructor_mask_instruction: ${params.instructor_mask_instruction}
  model_prompts: ${params.model_prompts}
  models:
    - name: ${params.model.name}
      revision: ${params.model.revision}
      batch_size: ${params.model.batch_size}
      normalize: ${params.model.normalize}
      model_kwargs:
        trust_remote_code: true
  tasks:
    # - ChemNQRetrieval # An official MTEB task by name
    - class: pipeline_lib.my_tasks.ChemQuest
      kwargs:
        data_dir: ${params.paths.mteb_task_dir}
        qrels_file: ${params.labeling.qrels_file}
  import_modules:
    - pipeline_lib.my_tasks
  # BM25 baseline (stages/run_bm25.py, model name "bm25"): rank_bm25 BM25Okapi on the same chunks and qrels
  bm25: {k1: 1.5, b: 0.75, lowercase: true}
  encode_kwargs:
    normalize_embeddings: false
  output_root: ${params.paths.test_results_dir}
  top_k: ${params.eval.top_k}

