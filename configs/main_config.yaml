# =================== GLOBAL PARAMS (programmable) ===================
params:
  model:
    name: intfloat/e5-large-v2
    dir: intfloat_e5_large_v2
    revision: b322e09026e4ea05f42beadf4d661fb4e101d311
    normalize: true
    batch_size: 32
    
  chunk:
    chunker: fixed_token
    size: 256
    overlap: 20
  paths:
    artifacts_root: artifacts
    chemquests_dir: ${params.paths.artifacts_root}/chemquests_hf_db
    screen_dir: ${params.paths.artifacts_root}/embedding_models_screening
    top_performer_input: ${params.paths.screen_dir}/validation_results
    test_name: ${params.model.dir}_${params.chunk.chunker}_c${params.chunk.size}_o${params.chunk.overlap}    
    chunks_dir: ${params.paths.artifacts_root}/tests/${params.paths.test_name}/chunks
    mteb_task_dir: ${params.paths.artifacts_root}/tests/${params.paths.test_name}/mteb_task
    test_results_dir: ${params.paths.artifacts_root}/tests/${params.paths.test_name}/results

  strategy_presets:
    fixed_token:
      name: fixed_token        # one of: fixed_token | recursive_token | kamradt | cluster_semantic | llm
      params:
        # ---- fixed_token (FixedTokenChunker) params ----
        encoding_name: cl100k_base
        model_name: null          # optional, overrides encoding_name
        chunk_size: ${params.chunk.size} 
        chunk_overlap: ${params.chunk.overlap} 
        keep_separator: false     # passed to base splitter if supported
        add_start_index: false
        strip_whitespace: true
    recursive_token:
      name: recursive_token
      params:
        chunk_size: ${params.chunk.size} 
        chunk_overlap: ${params.chunk.overlap} 
        separators: ["\n\n", "\n", ".", "?", "!", " ", ""]
        keep_separator: true
        is_separator_regex: false
    semantic_fixed:
      name: semantic
      params:
        use_recursive: false
        embedding_provider: huggingface
        embedding_model: sentence-transformers/all-MiniLM-L6-v2
        chunk_size: ${params.chunk.size} 
        chunk_overlap: ${params.chunk.overlap} 
        breakpoint_threshold_type: percentile
        breakpoint_threshold_amount: 95
        buffer_size: 1
        add_start_index: true
    semantic_recursive:
      name: semantic
      params:
        use_recursive: true
        embedding_provider: huggingface
        embedding_model: sentence-transformers/all-MiniLM-L6-v2
        chunk_size: ${params.chunk.size} 
        chunk_overlap: ${params.chunk.overlap} 
        breakpoint_threshold_type: percentile
        breakpoint_threshold_amount: 95
        buffer_size: 1
        add_start_index: true    
    hierarchical_section:
      name: hierarchical_section   # aliases: hierarchical | section | section_hier
      params:
        encoding_name: cl100k_base
        model_name: null
        chunk_size: 500
        chunk_overlap: ${params.chunk.overlap} 
        add_start_index: false
        strip_whitespace: true
        use_latex: true
        use_numbered_headings: true
        use_common_chem_headings: true
        use_generic_heading_heuristics: true
        custom_heading_regexes:
          - "^\\s*graphical\\s+abstract\\s*$"
          - "^\\s*experimental\\s+procedures?\\s*$"
          - "^\\s*author\\s+information\\s*$"
          - "^\\s*orcid\\s*:?"          # some PDFs render “ORCID:” with colon
          - "^\\s*corresponding\\s+author\\s*$"
          - "^\\s*author\\s+contributions?\\s*$"
          - "^\\s*funding(\\s+sources?)?\\s*$"
          - "^\\s*acknowledg(e)?ments?\\s*$"
          - "^\\s*abbreviations\\s*$"
          - "^\\s*references?\\s*$"
          - "^\\s*bibliograph(y|ies)\\s*$"
        join_short_sections: true
        min_section_tokens: 128
        prefer_merge_forward: true
        drop_tail_sections_matching:
              - "references"
              - "bibliography"
              - "works cited"
              - "author information"
              - "orcid"
              - "corresponding author"
              - "author contributions"
              - "funding sources"
              - "funding"
              - "acknowledg"          # matches acknowledgment / acknowledgments
              - "abbreviations"
              - "nomenclature"
              - "glossary"
              - "conflict of interest"
              - "declarations"
              - "data availability"
              - "supplementary information"
              - "supporting information"
              - "toc graphic"
              - "table of contents graphic"
        drop_from_first_match: true
    hybrid_multi:
      name: hybrid_multi       # aliases: hybrid
      params:
        encoding_name: cl100k_base
        model_name: null
        strip_whitespace: true
        levels: ["section", "paragraph", "sentence"]
        chunk_sizes:
          section: 500
          paragraph: 500
          sentence: ${params.chunk.size} 
        chunk_overlaps:
          section: ${params.chunk.overlap} 
          paragraph: ${params.chunk.overlap} 
          sentence: ${params.chunk.overlap} 
        approx_chars_per_token: 4
        sectioner:
          encoding_name: cl100k_base
          model_name: null
          chunk_size: 500
          chunk_overlap: ${params.chunk.overlap} 
          add_start_index: false
          strip_whitespace: true
          use_latex: true
          use_numbered_headings: true
          use_common_chem_headings: true
          use_generic_heading_heuristics: true
          custom_heading_regexes:
            - "^\\s*graphical\\s+abstract\\s*$"
            - "^\\s*experimental\\s+procedures?\\s*$"
            - "^\\s*author\\s+information\\s*$"
            - "^\\s*orcid\\s*:?"
            - "^\\s*corresponding\\s+author\\s*$"
            - "^\\s*author\\s+contributions?\\s*$"
            - "^\\s*funding(\\s+sources?)?\\s*$"
            - "^\\s*acknowledg(e)?ments?\\s*$"
            - "^\\s*abbreviations\\s*$"
            - "^\\s*references?\\s*$"
            - "^\\s*bibliograph(y|ies)\\s*$"
          join_short_sections: true
          min_section_tokens: 128
          prefer_merge_forward: true
          drop_tail_sections_matching:
            - "references"
            - "bibliography"
            - "works cited"
            - "author information"
            - "orcid"
            - "corresponding author"
            - "author contributions"
            - "funding sources"
            - "funding"
            - "acknowledg"
            - "abbreviations"
            - "nomenclature"
            - "glossary"
            - "conflict of interest"
            - "declarations"
            - "data availability"
            - "supplementary information"
            - "supporting information"
            - "toc graphic"
            - "table of contents graphic"
          drop_from_first_match: true
  strategy:
    preset: ${params.chunk.chunker}
    overrides: 
      params:
        chunk_size: ${params.chunk.size}  
        overlap: ${params.chunk.overlap}      
