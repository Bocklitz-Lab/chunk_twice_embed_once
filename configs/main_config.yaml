# =================== GLOBAL PARAMS (programmable) ===================
params:
  model:
    name: intfloat/e5-large-v2
    dir: intfloat_e5_large_v2
    revision: b322e09026e4ea05f42beadf4d661fb4e101d311
    normalize: true
    batch_size: 32

  # ---- chunking: ONE tokenizer and ONE breakpoint model for all evaluated models ----
  # chunking_tokenizer: HF tokenizer that counts chunk_size / chunk_overlap / min sizes for every model, so chunk
  #   boundaries (and qrels) are identical across models. Each model still embeds the text with its own tokenizer.
  #   "model" = legacy: the evaluated model's own tokenizer (all published runs), moving "main" revision.
  # semantic_breakpoint_model: the embedding model that finds the breakpoints of semantic-fixed / semantic-recursive,
  #   the same for all evaluated models. "model" = legacy (the evaluated model).
  # chunk_cache: prepared chunks + qrels, built once per (strategy, size, overlap) and reused by every model.
  chunking_tokenizer: bert-base-uncased
  chunking_tokenizer_revision: 86b5e0934494bd15c9632b12f734a8a67f723594
  semantic_breakpoint_model:
    name: sentence-transformers/all-MiniLM-L6-v2
    revision: 1110a243fdf4706b3f48f1d95db1a4f5529b4d41
  chunk_cache:
    enabled: true
    dir: ${params.paths.artifacts_root}/prepared

  # seed for python / numpy / torch in every stage-6 run (also used by the statistics tools)
  seed: 20261121

  chunk:
    chunker: fixed_token
    size: 256
    overlap: 20

  # Relevance labels (qrels) of the retrieval task.
  #   method:      span    labels from the evidence-span positions (stages/make_span_qrels.py)
  #                lexical labels from BM25 + Jaccard + fuzzy matching (stages/make_mteb_task.py)
  #   cover_level: c in (0, 1]: a chunk holding >= c of the evidence span is relevant (span method).
  #                Override per run with  --param labeling.cover_level=<value>  (EXTRA_PARAMS in the Makefile).
  #   qrels_file:  file of mteb_task_dir that stage 6 evaluates. null = derived from method and c
  #                (qrels_span_c<value>.jsonl, qrels_lexical.jsonl); set it only to use another name.
  labeling:
    method: span
    cover_level: 0.90
    qrels_file: null
  # ---- prompts (query / document prefixes or instructions), applied at encoding time only ----
  #   use_prompts: true   put model_prompts[model] in front of queries / chunks when encoding (Phase 1 and 2)
  #   use_prompts: false  old behaviour of all published runs: no prompt for any model
  # One entry per Phase 1 model (41). Empty string = no prompt on that side. Checked against each model card.
  use_prompts: true
  #   instructor_mask_instruction: true   INSTRUCTOR models (entries with mask_instruction: true, i.e. instructor-xl): the
  #       instruction goes through the encoder with the text but is left out of the mean pooling, as in the official
  #       INSTRUCTOR package (pipeline_lib/instruction_masking.py, verified against InstructorEmbedding 1.0.1 by
  #       tools/verify_instructor.py). false: plain prefix, pooling over all tokens (the instruction tokens are averaged too).
  #       Only acts together with use_prompts: true.
  instructor_mask_instruction: true
  # ---- chunk title ----
  #   embed_chunk_title: false  corpus.jsonl gets an empty title: MTEB embeds the chunk text only (ids stay in _id/id)
  #   embed_chunk_title: true  old behaviour of all published runs: the model sees "<doc> - Chunk <n> <text>"
  embed_chunk_title: false
  model_prompts:
    sentence-transformers/bert-base-nli-mean-tokens: {query: "", passage: "", card: "sentence-transformers card: plain text, no prompt"}
    allenai/scibert_scivocab_uncased: {query: "", passage: "", card: "pretrained encoder, card defines no prompt"}
    nomic-ai/nomic-bert-2048: {query: "", passage: "", card: "pretrained BERT, card defines no prompt"}
    intfloat/e5-small: {query: "query: ", passage: "passage: ", card: "E5 card: every input must start with \"query: \" or \"passage: \"; both for retrieval"}
    intfloat/e5-base: {query: "query: ", passage: "passage: ", card: "E5 card: every input must start with \"query: \" or \"passage: \"; both for retrieval"}
    intfloat/e5-large: {query: "query: ", passage: "passage: ", card: "E5 card: every input must start with \"query: \" or \"passage: \"; both for retrieval"}
    intfloat/e5-small-v2: {query: "query: ", passage: "passage: ", card: "E5 card: every input must start with \"query: \" or \"passage: \"; both for retrieval"}
    intfloat/e5-base-v2: {query: "query: ", passage: "passage: ", card: "E5 card: every input must start with \"query: \" or \"passage: \"; both for retrieval"}
    intfloat/e5-large-v2: {query: "query: ", passage: "passage: ", card: "E5 card: every input must start with \"query: \" or \"passage: \"; both for retrieval"}
    intfloat/multilingual-e5-small: {query: "query: ", passage: "passage: ", card: "E5 card: every input must start with \"query: \" or \"passage: \"; both for retrieval"}
    intfloat/multilingual-e5-base: {query: "query: ", passage: "passage: ", card: "E5 card: every input must start with \"query: \" or \"passage: \"; both for retrieval"}
    intfloat/multilingual-e5-large: {query: "query: ", passage: "passage: ", card: "E5 card: every input must start with \"query: \" or \"passage: \"; both for retrieval"}
    nomic-ai/nomic-embed-text-v1: {query: "search_query: ", passage: "search_document: ", card: "nomic card: the text must carry a task prefix; search_query / search_document for retrieval"}
    nomic-ai/nomic-embed-text-v1.5: {query: "search_query: ", passage: "search_document: ", card: "nomic card: the text must carry a task prefix; search_query / search_document for retrieval"}
    recobo/chemical-bert-uncased: {query: "", passage: "", card: "pretrained encoder, card defines no prompt"}
    BAAI/bge-m3: {query: "", passage: "", card: "bge-m3 card: no query instruction needed"}
    BAAI/bge-small-en: {query: "Represent this sentence for searching relevant passages: ", passage: "", card: "bge card: query instruction for retrieval, none for passages"}
    BAAI/bge-base-en: {query: "Represent this sentence for searching relevant passages: ", passage: "", card: "bge card: query instruction for retrieval, none for passages"}
    BAAI/bge-large-en: {query: "Represent this sentence for searching relevant passages: ", passage: "", card: "bge card: query instruction for retrieval, none for passages"}
    BAAI/bge-small-en-v1.5: {query: "Represent this sentence for searching relevant passages: ", passage: "", card: "bge v1.5 card: instruction optional (small drop without) but recommended for short queries against long documents (our case); none for passages"}
    BAAI/bge-base-en-v1.5: {query: "Represent this sentence for searching relevant passages: ", passage: "", card: "bge v1.5 card: instruction optional (small drop without) but recommended for short queries against long documents (our case); none for passages"}
    BAAI/bge-large-en-v1.5: {query: "Represent this sentence for searching relevant passages: ", passage: "", card: "bge v1.5 card: instruction optional (small drop without) but recommended for short queries against long documents (our case); none for passages"}
    sentence-transformers/all-mpnet-base-v2: {query: "", passage: "", card: "sentence-transformers card: plain text, no prompt"}
    sentence-transformers/multi-qa-mpnet-base-dot-v1: {query: "", passage: "", card: "sentence-transformers card: plain text, no prompt"}
    sentence-transformers/all-MiniLM-L12-v2: {query: "", passage: "", card: "sentence-transformers card: plain text, no prompt"}
    sentence-transformers/all-MiniLM-L6-v2: {query: "", passage: "", card: "sentence-transformers card: plain text, no prompt"}
    m3rg-iitd/matscibert: {query: "", passage: "", card: "pretrained encoder, card defines no prompt"}
    allenai/specter: {query: "", passage: "", card: "SPECTER card: title+abstract text, no prompt"}
    facebook/contriever: {query: "", passage: "", card: "contriever card: plain text, no prompt"}
    hkunlp/instructor-xl: {query: "Represent the Wikipedia question for retrieving supporting documents: ", passage: "Represent the Wikipedia document for retrieval: ", card: "instructor-xl card retrieval example (given as text prefix; plain SentenceTransformer pooling includes the instruction tokens)", mask_instruction: true}
    facebook/contriever-msmarco: {query: "", passage: "", card: "contriever card: plain text, no prompt"}
    sentence-transformers/gtr-t5-base: {query: "", passage: "", card: "sentence-transformers card: plain text, no prompt"}
    sentence-transformers/gtr-t5-large: {query: "", passage: "", card: "sentence-transformers card: plain text, no prompt"}
    sentence-transformers/gtr-t5-xl: {query: "", passage: "", card: "sentence-transformers card: plain text, no prompt"}
    microsoft/mpnet-base: {query: "", passage: "", card: "pretrained encoder, card defines no prompt (no README for mpnet-base / ChemBERTa)"}
    microsoft/MiniLM-L12-H384-uncased: {query: "", passage: "", card: "pretrained encoder, card defines no prompt"}
    sentence-transformers/paraphrase-multilingual-mpnet-base-v2: {query: "", passage: "", card: "sentence-transformers card: plain text, no prompt"}
    nomic-ai/nomic-embed-text-v2-moe: {query: "search_query: ", passage: "search_document: ", card: "nomic card: the text must carry a task prefix; search_query / search_document for retrieval"}
    microsoft/BiomedNLP-PubMedBERT-base-uncased-abstract-fulltext: {query: "", passage: "", card: "pretrained encoder, card defines no prompt"}
    DeepChem/ChemBERTa-77M-MTR: {query: "", passage: "", card: "pretrained encoder, card defines no prompt (no README for mpnet-base / ChemBERTa)"}
    microsoft/BiomedNLP-BiomedBERT-base-uncased-abstract: {query: "", passage: "", card: "pretrained encoder, card defines no prompt"}
    bert-base-uncased: {query: "", passage: "", card: "transfer-only extra model (strict base of bert-base-nli-mean-tokens, not a Phase 1 model): pretrained encoder, no prompt"}
  paths:
    artifacts_root: artifacts
    chemquests_dir: ${params.paths.artifacts_root}/chemquests_hf_db
    screen_dir: ${params.paths.artifacts_root}/embedding_models_screening
    # Phase 1 results folder (below screen_dir): ONE key, written by stage 1 and read by stage 2 (stage1.output_root, stage2.results_subdir and the
    # stage 2 output files all derive from it, so they cannot diverge). It is a NEW folder: the published no-prompt Phase 1 results in
    # `validation/` are never overwritten or reused. Stage 1 refuses a folder that already holds results unless --force is given.
    phase1_results_subdir: validation_prompts
    top_performer_input: ${params.paths.screen_dir}/${params.paths.phase1_results_subdir}
    test_name: ${params.model.dir}_${params.chunk.chunker}_c${params.chunk.size}_o${params.chunk.overlap}    
    chunks_dir: ${params.paths.artifacts_root}/tests/${params.paths.test_name}/chunks
    mteb_task_dir: ${params.paths.artifacts_root}/tests/${params.paths.test_name}/mteb_task
    test_results_dir: ${params.paths.artifacts_root}/tests/${params.paths.test_name}/results

  strategy_presets:
    fixed_token:
      name: fixed_token
      params:
        model_name: ${params.chunking_resolved.tokenizer}   # chunking tokenizer (see chunking_tokenizer)
        tokenizer_revision: ${params.chunking_resolved.tokenizer_revision}
        chunk_size: ${params.chunk.size}
        chunk_overlap: ${params.chunk.overlap}
        add_start_index: false
        strip_whitespace: true

    recursive_token:
      name: recursive_token
      params:
        chunk_size: ${params.chunk.size}
        chunk_overlap: ${params.chunk.overlap}
        separators: ["\n\n", "\n", ".", "?", "!", " ", ""]
        keep_separator: true
        is_separator_regex: false
        model_name: ${params.chunking_resolved.tokenizer}   # chunking tokenizer (see chunking_tokenizer)
        tokenizer_revision: ${params.chunking_resolved.tokenizer_revision}
        add_start_index: false                               # set true to annotate start offsets
        strip_whitespace: true                               # trim around splits

    semantic_fixed:
      name: semantic
      params:
        model_name: ${params.chunking_resolved.tokenizer}   # tokenizer that counts sizes (chunking_tokenizer)
        tokenizer_revision: ${params.chunking_resolved.tokenizer_revision}
        breakpoint_model_name: ${params.chunking_resolved.breakpoint_model}      # same model for all evaluated models
        breakpoint_model_revision: ${params.chunking_resolved.breakpoint_revision}
        model_kwargs:
          trust_remote_code: true
        use_recursive: false
        chunk_size: ${params.chunk.size}
        chunk_overlap: ${params.chunk.overlap}
        breakpoint_threshold_type: percentile
        breakpoint_threshold_amount: 95
        buffer_size: 1
        add_start_index: true
        strip_whitespace: true
        min_chunk_size: 128
        min_chunk_unit: tokens   # "chars" = legacy LangChain character count (published runs)
        # semantic breakpoints do not depend on chunk size/overlap: cache them per (model, document)
        cache_dir: ${params.paths.artifacts_root}/semantic_cache


    semantic_recursive:
      name: semantic
      params:
        model_name: ${params.chunking_resolved.tokenizer}   # tokenizer that counts sizes (chunking_tokenizer)
        tokenizer_revision: ${params.chunking_resolved.tokenizer_revision}
        breakpoint_model_name: ${params.chunking_resolved.breakpoint_model}      # same model for all evaluated models
        breakpoint_model_revision: ${params.chunking_resolved.breakpoint_revision}
        model_kwargs:
          trust_remote_code: true
        use_recursive: true
        chunk_size: ${params.chunk.size}
        chunk_overlap: ${params.chunk.overlap}
        breakpoint_threshold_type: percentile
        breakpoint_threshold_amount: 95
        buffer_size: 1
        add_start_index: true
        strip_whitespace: true
        min_chunk_size: 128
        min_chunk_unit: tokens   # "chars" = legacy LangChain character count (published runs)
        # semantic breakpoints do not depend on chunk size/overlap: cache them per (model, document)
        cache_dir: ${params.paths.artifacts_root}/semantic_cache
  

    hierarchical_section:
      name: hierarchical_section   # aliases: hierarchical | section | section_hier
      params:
        model_name: ${params.chunking_resolved.tokenizer}   # chunking tokenizer (see chunking_tokenizer)
        tokenizer_revision: ${params.chunking_resolved.tokenizer_revision}
        chunk_size: ${params.chunk.size}
        chunk_overlap: ${params.chunk.overlap} 
        add_start_index: false
        strip_whitespace: true
        use_latex: true
        use_numbered_headings: true
        use_common_chem_headings: true
        use_generic_heading_heuristics: true
        custom_heading_regexes:
          - "^\\s*graphical\\s+abstract\\s*$"
          - "^\\s*experimental\\s+procedures?\\s*$"
          - "^\\s*author\\s+information\\s*$"
          - "^\\s*orcid\\s*:?"          # some PDFs render “ORCID:” with colon
          - "^\\s*corresponding\\s+author\\s*$"
          - "^\\s*author\\s+contributions?\\s*$"
          - "^\\s*funding(\\s+sources?)?\\s*$"
          - "^\\s*acknowledg(e)?ments?\\s*$"
          - "^\\s*abbreviations\\s*$"
          - "^\\s*references?\\s*$"
          - "^\\s*bibliograph(y|ies)\\s*$"
        join_short_sections: true
        min_section_tokens: 128
        prefer_merge_forward: true
        drop_tail_sections_matching:
              - "references"
              - "bibliography"
              - "works cited"
              - "author information"
              - "orcid"
              - "corresponding author"
              - "author contributions"
              - "funding sources"
              - "funding"
              - "acknowledg"          # matches acknowledgment / acknowledgments
              - "abbreviations"
              - "nomenclature"
              - "glossary"
              - "conflict of interest"
              - "declarations"
              - "data availability"
              - "supplementary information"
              - "supporting information"
              - "toc graphic"
              - "table of contents graphic"
        drop_from_first_match: true

    hybrid_multi:
      name: hybrid_multi
      params:
        model_name: ${params.model.name}   
        strip_whitespace: true
        levels: ["section", "paragraph", "sentence"]
        chunk_sizes:
          section: ${params.chunk.size}
          paragraph: ${params.chunk.size}
          sentence: ${params.chunk.size}
        chunk_overlaps:
          section: ${params.chunk.overlap}
          paragraph: ${params.chunk.overlap}
          sentence: ${params.chunk.overlap}
        approx_chars_per_token: 4  # kept for API compatibility; unused when HF tokens are active
        sectioner:
          model_name: ${params.model.name}
          chunk_size: ${params.chunk.size}
          chunk_overlap: ${params.chunk.overlap}
          add_start_index: false
          strip_whitespace: true
          use_latex: true
          use_numbered_headings: true
          use_common_chem_headings: true
          use_generic_heading_heuristics: true
          custom_heading_regexes:
            - "^\\s*graphical\\s+abstract\\s*$"
            - "^\\s*experimental\\s+procedures?\\s*$"
            - "^\\s*author\\s+information\\s*$"
            - "^\\s*orcid\\s*:?$"
            - "^\\s*corresponding\\s+author\\s*$"
            - "^\\s*author\\s+contributions?\\s*$"
            - "^\\s*funding(\\s+sources?)?\\s*$"
            - "^\\s*acknowledg(e)?ments?\\s*$"
            - "^\\s*abbreviations\\s*$"
            - "^\\s*references?\\s*$"
            - "^\\s*bibliograph(y|ies)\\s*$"
          join_short_sections: true
          min_section_tokens: 128
          prefer_merge_forward: true
          drop_tail_sections_matching:
            - "references"
            - "bibliography"
            - "works cited"
            - "author information"
            - "orcid"
            - "corresponding author"
            - "author contributions"
            - "funding sources"
            - "funding"
            - "acknowledg"
            - "abbreviations"
            - "nomenclature"
            - "glossary"
            - "conflict of interest"
            - "declarations"
            - "data availability"
            - "supplementary information"
            - "supporting information"
            - "toc graphic"
            - "table of contents graphic"
          drop_from_first_match: true

  # Pilot (python -m stages.rerun all --pilot): own artifacts root, nothing of artifacts/tests is touched.
  pilot:
    report_dir: results/v2-revision/pilot     # tracked summary tables of the pilot
    artifacts_root: artifacts/pilot_v2      # artifacts/pilot is the first pilot (chunk title embedded, old stage 3 files): kept as it is
    models: ["intfloat/e5-large-v2@b322e09026e4ea05f42beadf4d661fb4e101d311", "BAAI/bge-m3@5617a9f61b028005a4858fdac845db406aefb181", "bm25@rank_bm25"]
    chunkers: [fixed_token, hierarchical_section]
    sizes: [128, 512]
    overlaps: [0]

  # Transfer runs (Reviewer 1 comment 3 / Reviewer 2 item 3): models that Phase 1 did NOT shortlist (plus three shortlisted references) on a small set
  # of ChemQuests configurations, in the new pipeline (reference-tokenizer chunks, span labels, prompts). `make transfer` = stages/transfer.py:
  # one `stages.rerun eval` per configuration, own artifacts root, no BM25 / hybrid / rerank, efficiency flags of the Makefile. The prepared folders
  # (chunks, labels) and the ChemQuests inputs are SHARED with the main run (chunk_cache.dir and paths.chemquests_dir of the main artifacts root), so
  # a transfer run sees byte-identical chunks and labels. Start only after `make prepare` of the main run has built these configurations.
  #   models:  name + PINNED revision (the Phase 1 pin; checked against stage1.models) + role + group (a-e as in the Reviewer 1 experiment:
  #            a domain-pretrained, b general-domain, c general-domain retrieval/similarity tuned, d shortlisted retrieval-tuned, e SPECTER)
  #            Every model needs an entry in params.model_prompts (checked). Extra models are not Phase 1 models: they have a prompt entry (none)
  #            but no stage1.models pin; their revision is pinned here.
  #   configurations: id, chunker, size, overlap; each must be valid in pipeline_lib/grid.py. C1-C5 = main; C6 (fixed-token 128/0) is an extra
  #            sensitivity configuration that is never mixed into the C1-C5 averages.
  #   pairs:   tuned - base pairs of the Reviewer 1 experiment (P1-P4) and the domain-pretraining pairs (P5a-e), read by tools/phase_transfer.py.
  transfer:
    artifacts_root: artifacts/transfer
    report_dir: results/v2-revision/transfer
    run_shortlisted_references: true     # false: skip the three role=shortlisted_reference models (they are in the main run anyway)
    run_extras: true                     # false: skip role=extra models and configurations with extra: true (cheap: ~30 min on one GPU)
    configurations:
      - {id: C1, chunker: fixed_token,          size: 512, overlap: 0}
      - {id: C2, chunker: recursive_token,      size: 512, overlap: 0}
      - {id: C3, chunker: hierarchical_section, size: 512, overlap: 0}
      - {id: C4, chunker: fixed_token,          size: 384, overlap: 32}
      - {id: C5, chunker: fixed_token,          size: 256, overlap: 0}
      - {id: C6, chunker: fixed_token,          size: 128, overlap: 0, extra: true}
    models:
      - {name: allenai/scibert_scivocab_uncased,                          revision: 24f92d32b1bfb0bcaf9ab193ff3ad01e87732fc1, role: non_shortlisted, group: a}
      - {name: DeepChem/ChemBERTa-77M-MTR,                                revision: 66b895cab8adebea0cb59a8effa66b2020f204ca, role: non_shortlisted, group: a}
      - {name: recobo/chemical-bert-uncased,                              revision: 498698d28fcf7ce5954852a0444c864bdf232b64, role: non_shortlisted, group: a}
      - {name: m3rg-iitd/matscibert,                                      revision: ced9d8f5f208712c4a90f98a246fe32155b29995, role: non_shortlisted, group: a}
      - {name: microsoft/BiomedNLP-PubMedBERT-base-uncased-abstract-fulltext, revision: e1354b7a3a09615f6aba48dfad4b7a613eef7062, role: non_shortlisted, group: a}
      - {name: allenai/specter,                                           revision: 81cbfb43d4fc2e728d5b4201ce14987db8d0854c, role: non_shortlisted, group: e}
      - {name: sentence-transformers/all-mpnet-base-v2,                   revision: e8c3b32edf5434bc2275fc9bab85f82640a19130, role: non_shortlisted, group: c}
      - {name: facebook/contriever,                                       revision: 2bd46a25019aeea091fd42d1f0fd4801675cf699, role: non_shortlisted, group: b}
      - {name: facebook/contriever-msmarco,                               revision: abe8c1493371369031bcb1e02acb754cf4e162fa, role: non_shortlisted, group: c}
      - {name: microsoft/mpnet-base,                                      revision: 6996ce1e91bd2a9c7d7f61daec37463394f73f09, role: non_shortlisted, group: b}
      - {name: sentence-transformers/multi-qa-mpnet-base-dot-v1,          revision: 17997f24dca0df1a4fed68894fb0e1e133e60482, role: non_shortlisted, group: c}
      - {name: microsoft/MiniLM-L12-H384-uncased,                         revision: 44acabbec0ef496f6dbc93adadea57f376b7c0ec, role: non_shortlisted, group: b}
      - {name: sentence-transformers/all-MiniLM-L12-v2,                   revision: a50ef00143b4d5391434df20ae11632588ac25be, role: non_shortlisted, group: c}
      - {name: sentence-transformers/bert-base-nli-mean-tokens,           revision: 160a52b38a51ae87295ec3eabcf11755e5d27a8d, role: non_shortlisted, group: c}
      - {name: intfloat/e5-large-v2,                                      revision: b322e09026e4ea05f42beadf4d661fb4e101d311, role: shortlisted_reference, group: d}
      - {name: BAAI/bge-large-en-v1.5,                                    revision: d4aa6901d3a41ba39fb536a557fa166f842b0e09, role: shortlisted_reference, group: d}
      - {name: nomic-ai/nomic-embed-text-v1.5,                            revision: b0753ae76394dd36bcfb912a46018088bca48be0, role: shortlisted_reference, group: d}
      # retrieval-tuned models of the PUBLISHED shortlist that the prompted rule does not select (params.phase1.selection): kept here so that the paper can show how they
      # perform at C1-C6 (group f). Roles are checked against the stage 2 file (stages/transfer.py: check_roles).
      - {name: BAAI/bge-m3,                                 revision: 5617a9f61b028005a4858fdac845db406aefb181, role: non_shortlisted, group: f}
      - {name: hkunlp/instructor-xl,                        revision: ce48b213095e647a6c3536364b9fa00daf57f436, role: non_shortlisted, group: f}
      - {name: intfloat/e5-large,                           revision: 4dc6d853a804b9c8886ede6dda8a073b7dc08a81, role: non_shortlisted, group: f}
      - {name: BAAI/bge-base-en-v1.5,                       revision: a5beb1e3e68b9ab74eb54cfd186867f64f240e1a, role: non_shortlisted, group: f}
      - {name: microsoft/BiomedNLP-BiomedBERT-base-uncased-abstract,          revision: d673b8835373c6fa116d6d8006b33d48734e305d, role: non_shortlisted, group: a}
      # strict base of bert-base-nli-mean-tokens (pair P4a); NOT a Phase 1 model: pinned here, prompt entry in params.model_prompts (none)
      - {name: bert-base-uncased,                                         revision: 86b5e0934494bd15c9632b12f734a8a67f723594, role: extra, group: b}
    pairs:
      - {id: P1,  base: facebook/contriever,                  tuned: [facebook/contriever-msmarco], note: "same BERT-base, contrastive pretraining; + MS MARCO supervised retrieval fine-tuning"}
      - {id: P2,  base: microsoft/mpnet-base,                 tuned: [sentence-transformers/all-mpnet-base-v2, sentence-transformers/multi-qa-mpnet-base-dot-v1], note: "same MPNet-base; + 1B-pair / QA-pair similarity tuning"}
      - {id: P3,  base: microsoft/MiniLM-L12-H384-uncased,    tuned: [sentence-transformers/all-MiniLM-L12-v2], note: "same MiniLM-L12-H384; + 1B-pair similarity tuning"}
      - {id: P4a, base: bert-base-uncased,                    tuned: [sentence-transformers/bert-base-nli-mean-tokens], note: "strict pair: bert-base-uncased -> NLI sentence-embedding tuning"}
      - {id: P4b, base: allenai/scibert_scivocab_uncased,     tuned: [sentence-transformers/bert-base-nli-mean-tokens], note: "domain-pretrained BERT-base (SciBERT) vs general BERT-base + NLI tuning (different pretraining, not a strict pair)"}
      # domain pretraining isolated: base = general bert-base-uncased (same architecture, tokenizer family differs), "tuned" = BERT-base pretrained on a domain corpus; both untuned for retrieval.
      # bert-base-uncased is not a Phase 1 model (no Phase 1 columns for the base). ChemBERTa-77M-MTR is a SMILES model (other architecture, other input) and is deliberately NOT in these pairs.
      - {id: P5a, base: bert-base-uncased, tuned: [allenai/scibert_scivocab_uncased],  note: "scientific text (SciBERT, own scivocab)"}
      - {id: P5b, base: bert-base-uncased, tuned: [m3rg-iitd/matscibert],              note: "materials-science text (MatSciBERT)"}
      - {id: P5c, base: bert-base-uncased, tuned: [microsoft/BiomedNLP-PubMedBERT-base-uncased-abstract-fulltext], note: "biomedical abstracts + full text (PubMedBERT = BiomedBERT-abstract-fulltext)"}
      - {id: P5d, base: bert-base-uncased, tuned: [microsoft/BiomedNLP-BiomedBERT-base-uncased-abstract], note: "biomedical abstracts (BiomedBERT-abstract)"}
      - {id: P5e, base: bert-base-uncased, tuned: [recobo/chemical-bert-uncased],      note: "chemistry text (ChemBERT)"}
    groups:
      a: domain-pretrained, no retrieval tuning
      b: general-domain, no retrieval tuning
      c: general-domain, retrieval/similarity tuned
      d: shortlisted retrieval-tuned (selected by params.phase1.selection)
      f: retrieval-tuned, not selected by params.phase1.selection (published top-8 union members that the prompted rule drops)
      e: domain-pretrained + citation-contrastive tuning (SPECTER; outside a-d)

  # Manual validation of the span labels (tools/validation_sample.py, tools/kappa.py): a seeded sample of questions, stratified by the official
  # question type (4 exclusive strata; question_metadata.jsonl), topped up so that every one of the 17 question-level subfields has at least
  # min_per_subfield sampled questions (the two subfields of a question are a set, not a ranking).
  # Each item shows the question, the span with context_chars characters of context on each side and, for each configuration below, the chunks that the
  # span rule (labeling.cover_level) labelled relevant. One sheet per annotator, same order. Run `make prepare` first (the sheets read the prepared folders).
  validation:
    n_questions: 100
    seed: 20261121
    min_per_subfield: 2
    context_chars: 300
    annotators: [annotator_1, annotator_2]
    configurations:
      - {chunker: fixed_token,          size: 128, overlap: 0}
      - {chunker: fixed_token,          size: 512, overlap: 0}
      - {chunker: hierarchical_section, size: 512, overlap: 0}

  # Analysis tools that run on the outputs of the full rerun (`make analysis`, tools/token_budget.py, subfield_breakdown.py, variance_decomposition.py,
  # winner_stability.py, phase_transfer.py, examples.py, fragmentation.py): see README. All use params.report.resamples / params.seed.
  analysis:
    enabled_in_report: false          # true: make report runs `make analysis` as its last step (needs the reports of the main run and of the transfer root)
    out_dir: results/v2-revision/analysis
    # tools/subfield_breakdown.py (question type, automatic question features, subfield): a group with fewer questions than this gets its numbers and
    # intervals but no test (no p-value, no contrast)
    breakdown:
      min_questions_for_test: 30
    # tools/question_features_check.py: the seeded sample for the hand check of auto_has_number / auto_has_formula
    question_features_check:
      n_questions: 50                 # 25 flagged + 25 not flagged for each feature (the two samples may overlap)
      n_spans: 50                     # the same for the EVIDENCE SPANS (auto_span_has_number / auto_span_has_formula): span_features_check.csv
      seed: 20261121
    token_budgets: [512, 1024, 2048]  # reference-tokenizer tokens handed over to the reader (tools/token_budget.py)
    cover_levels: [0.8, 0.9, 1.0]     # cover-level sensitivity (tools/rescore.py, with paper-level intervals); labeling.cover_level is the primary
    # tools/fragmentation.py: questions whose evidence the small size splits vs the gain at the large size (same strategy, same model, this overlap)
    fragmentation:
      overlap: 0
      pairs: [[128, 512], [128, 256], [256, 512]]      # [small size, large size]; each size must exist with this overlap in the grid
    # tools/examples.py: named success / failure cases for the discussion
    examples:
      seed: 20261121
      n_per_rule: 10
      size_pairs: [[128, 512]]       # fails_small_works_large: [small size, large size], same model, strategy and overlap
      works_ndcg: 0.5                # a question "works" with Recall@10 = 1 and nDCG@10 >= this
      margin: 0.5                    # dense / BM25 "wins" by at least this much nDCG@10
      excerpt_chars: 300
      top_chunks: 3
      chunk_chars: 400

  # Efficiency measures (pipeline_lib/efficiency.py): index size, model size, peak GPU memory, corpus encoding time / throughput and per-query latency,
  # kept apart from evaluation_time. ON by default in the Makefile (STAGE1_ARGS = --efficiency, EFFICIENCY_ARGS = --efficiency --latency; set them empty
  # to switch off). The probe only watches encode(): scores, rankings and stage timings are unchanged. Peak memory, throughput and latency cannot be
  # backfilled, so they must be on in the run itself (finished runs are skipped).
  # The index / model / encoding columns are recorded for EVERY run; latency (batch size 1, warm-up, exact cosine top-10) only for the configurations
  # below, for all models (latency_models: [] = all). A --latency-* flag on the command line replaces this subset.
  efficiency:
    latency_queries: 200       # queries timed per configuration, evenly spaced (0 = all)
    latency_warmup: 10         # untimed queries before the timed ones
    latency_device: cpu        # where the timed search runs; cpu = as MTEB's exact search
    latency_models: []
    latency_cells:
      - {chunker: fixed_token, size: 128, overlap: 0}
      - {chunker: fixed_token, size: 256, overlap: 0}
      - {chunker: fixed_token, size: 512, overlap: 0}
      - {chunker: hierarchical_section, size: 512, overlap: 0}

  # Hybrid retrieval: reciprocal rank fusion of each dense run with the BM25 run of the same configuration
  # (tools/hybrid.py; needs no embedding). Written as run folders hybrid_rrf<k>_<dense>_<bm25>_<chunker>_c<L>_o<O>.
  hybrid:
    enabled: true
    k: 60
    depth: 100

  # Cross-encoder reranking of the saved top-N of finished dense runs (tools/rerank.py; post-hoc, no embedding, no new chunking).
  # Candidates below rank N keep their original order. Written as run folders
  # rerank_<reranker>_top<N>_<dense>_<chunker>_c<L>_o<O> (run_info.json: rerank {model, revision, top_n, dense, depth}).
  #   model / revision  the cross-encoder and its PINNED commit (sentence_transformers.CrossEncoder; never "main")
  #   top_n             primary depth: every dense run of `models` is reranked at this depth (the main report tables)
  #   models            dense models that are reranked at the primary depth (names as in the runs; [] = every dense run of the
  #                     invocation). Cost: top_n x 952 pairs per run (~48k pairs at top_n 50, ~3 min per run at size 256 on an RTX 3090), so the
  #                     study reranks e5-large-v2 only.
  #   ablation          extra depths for chosen runs (the "rerank depth ablation" table). Each entry: model (name or its last path
  #                     component), chunker, size, overlap (a number, a list or omitted = all) and top_n (a number or a list).
  #                     Nothing is tied to a size, but every entry must match the grid of the invocation: stages/rerun.py checks this BEFORE
  #                     any run starts and aborts if a chunker / size / overlap is not part of --chunkers / --sizes / --overlaps (so a changed
  #                     grid can never silently skip the ablation). The size below must be a chunk size of the final grid; update it with the grid.
  #   batch_size / max_length / fp16   forward-pass settings (max_length counts query + chunk tokens of the reranker tokenizer)
  #   depth             length of the written ranking (like every run); top_n <= depth
  rerank:
    enabled: true
    model: BAAI/bge-reranker-v2-m3
    revision: 953dc6f6f85a1b2dbfca4c34a2796e7dde08d41e
    top_n: 50
    depth: 100
    batch_size: 32
    max_length: 1024
    fp16: true
    models: [intfloat/e5-large-v2]
    ablation:
      - {model: intfloat/e5-large-v2, chunker: fixed_token, size: 256, overlap: 0, top_n: [20, 100]}

  # External MTEB tasks of Phase 1 (stages/run_bm25_mteb.py = `make external-bm25`): BM25 only, the dense Phase 1 results are not re-run.
  # Paths are relative to the artifacts root. BM25 is written to output_subdir, NOT to the folder stage 2 screens, so that it can never
  # change the Phase 2 shortlist; the report (table_external) reads output_subdir and phase1_subdirs together.
  external:
    tasks: [ChemNQRetrieval, ChemHotpotQARetrieval]
    output_subdir: embedding_models_screening/baselines
    phase1_subdirs: [embedding_models_screening/validation_prompts]   # the Phase 1 run with prompts (params.paths.phase1_results_subdir); add the published folder with --external-root
    top_k: 100

  # ---- Phase 1 evaluation split (pipeline_lib/phase1_split.py): the ONE key that stage 2, table_external, tools/phase_transfer.py, stages/run_bm25_mteb.py and
  # the efficiency table read. MTEB scores every split of a task and writes them all to <Task>.json; the split that counts is this one, with no fallback order.
  # The published Phase 1 numbers (Table 1) and the published shortlist are on "test" for both tasks (checked on the published files). ChemHotpotQARetrieval
  # has train (180 queries), dev (8) and test (18) over the same 10,069 passages; ChemNQRetrieval has test only (27 queries, 22,933 passages).
  # Do not change this to compare with the paper: a rerun with another split gives another shortlist (docs/PAPER_NOTES_phase1_split.md).
  phase1:
    eval_split: {ChemNQRetrieval: test, ChemHotpotQARetrieval: test}
    # ---- Phase 2 model selection (stage 2, pipeline_lib/shortlist.py). Stated BEFORE the prompted results were looked at; do not tune the threshold. ----
    #   rule: top_fraction           the published rule: union over the tasks of the top `top_fraction` (20 % of 41 = 8 models) of the point-estimate ranking
    #   rule: inclusion_probability  the same union rule, made robust to the small query sets (ChemNQ test 27, ChemHotpot test 18): a model is selected if
    #                                P(top `top_fraction` of the task) >= min_inclusion_probability on at least one task, P = share of `resamples` query-level
    #                                bootstrap resamples (tools/phase1_intervals.py, params.seed). The observed top models are always selected (the rule only widens).
    #   The outcome under 0.4 / 0.5 / 0.6 is reported in shortlist_selection__<folder>.csv; more than `max_models` selected -> stage 2 stops and reports.
    selection:
      rule: inclusion_probability
      top_fraction: 0.2
      min_inclusion_probability: 0.5
      resamples: 10000
      max_models: 18
    save_per_query: true             # stage 1 also writes the top-100 run and per-query nDCG@10 / Recall@10 of that split (never changes an MTEB score)
    n_queries:                       # queries per split, counted in the dataset files (BASF-AI/ChemHotpotQARetrieval, BASF-AI/ChemNQRetrieval)
      ChemNQRetrieval: {test: 27}
      ChemHotpotQARetrieval: {train: 180, dev: 8, test: 18}

  # Figures of `make report` (tools/figures.py). model_families: family -> the models in it, for the compact variant of the quality-time figure (read from here,
  # never parsed from a name; a model that is in no list is drawn as "Other"). The chunking strategies, sizes and overlaps are read from the data.
  figures:
    model_families:
      E5: [intfloat/e5-small, intfloat/e5-base, intfloat/e5-large, intfloat/e5-small-v2, intfloat/e5-base-v2, intfloat/e5-large-v2]
      Multilingual E5: [intfloat/multilingual-e5-small, intfloat/multilingual-e5-base, intfloat/multilingual-e5-large]
      BGE: [BAAI/bge-small-en, BAAI/bge-base-en, BAAI/bge-large-en, BAAI/bge-small-en-v1.5, BAAI/bge-base-en-v1.5, BAAI/bge-large-en-v1.5, BAAI/bge-m3]
      Nomic: [nomic-ai/nomic-embed-text-v1, nomic-ai/nomic-embed-text-v1.5, nomic-ai/nomic-embed-text-v2-moe]
      Instructor: [hkunlp/instructor-xl]

  # Report step, run automatically at the end of `make eval` / `make rerun` / `make pilot` (tools/make_report.py):
  # run table, identical-input check, bootstrap CIs (query + paper level), paired tests (Holm), label agreement, coverage
  # diagnostics, lexical-overlap diagnostic, truncation summary and the paper tables. The small CSVs are copied to out_dir
  # (tracked by git); the large per-question files stay in <artifacts root>/report/.
  report:
    enabled: true
    out_dir: results/v2-revision
    resamples: 10000          # paper / query bootstrap resamples of every interval and paired test (also read by tools/stats, lexical_overlap, make analysis)
    overlap: true
    track_max_mb: 5

  eval:
    # Retrieval depth saved per query (run_top<k>.trec.gz, per_query_metrics.csv). 100 for the reviewer-revision runs.
    # null = MTEB default depth 1000 (published runs: aggregates only). Legacy: --param eval.top_k=null
    top_k: 100

  strategy:
    preset: ${params.chunk.chunker}
    overrides: 
      params:
        chunk_size: ${params.chunk.size}  
        overlap: ${params.chunk.overlap}      
