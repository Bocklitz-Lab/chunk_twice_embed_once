input_path: artifacts/chemquests_hf_db/full_text.jsonl
output_path: artifacts/tests/nomic_ai_nomic_embed_text_v1_fixed_token_c128_o32/chunks/chunks.jsonl
text_field: text
id_field: corpus_id
token_count_encoding: cl100k_base
token_count_model: null
compute_offsets: true
max_docs: null
strategy:
  name: fixed_token
  params:
    model_name: nomic-ai/nomic-embed-text-v1
    chunk_size: 128
    chunk_overlap: 32
    add_start_index: false
    strip_whitespace: true
