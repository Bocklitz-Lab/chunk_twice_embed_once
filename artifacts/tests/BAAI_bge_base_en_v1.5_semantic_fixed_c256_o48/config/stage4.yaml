input_path: artifacts/chemquests_hf_db/full_text.jsonl
output_path: artifacts/tests/BAAI_bge_base_en_v1.5_semantic_fixed_c256_o48/chunks/chunks.jsonl
text_field: text
id_field: corpus_id
token_count_encoding: cl100k_base
token_count_model: null
compute_offsets: true
max_docs: null
strategy:
  name: semantic
  params:
    model_name: BAAI/bge-base-en-v1.5
    use_recursive: false
    chunk_size: 256
    chunk_overlap: 48
    breakpoint_threshold_type: percentile
    breakpoint_threshold_amount: 95
    buffer_size: 1
    add_start_index: true
    strip_whitespace: true
    min_chunk_size: 128
