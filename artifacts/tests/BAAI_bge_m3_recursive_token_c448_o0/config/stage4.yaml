input_path: artifacts/chemquests_hf_db/full_text.jsonl
output_path: artifacts/tests/BAAI_bge_m3_recursive_token_c448_o0/chunks/chunks.jsonl
text_field: text
id_field: corpus_id
token_count_encoding: cl100k_base
token_count_model: null
compute_offsets: true
max_docs: null
strategy:
  name: recursive_token
  params:
    chunk_size: 448
    chunk_overlap: 0
    separators:
    - '\n\n'
    - '\n'
    - .
    - '?'
    - '!'
    - ' '
    - ''
    keep_separator: true
    is_separator_regex: false
    model_name: BAAI/bge-m3
    add_start_index: false
    strip_whitespace: true
