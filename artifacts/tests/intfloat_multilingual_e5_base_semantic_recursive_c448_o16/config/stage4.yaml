input_path: artifacts/chemquests_hf_db/full_text.jsonl
output_path: artifacts/tests/intfloat_multilingual_e5_base_semantic_recursive_c448_o16/chunks/chunks.jsonl
text_field: text
id_field: corpus_id
token_count_encoding: cl100k_base
token_count_model: null
compute_offsets: true
max_docs: null
strategy:
  name: semantic
  params:
    model_name: intfloat/multilingual-e5-base
    use_recursive: true
    chunk_size: 448
    chunk_overlap: 16
    breakpoint_threshold_type: percentile
    breakpoint_threshold_amount: 95
    buffer_size: 1
    add_start_index: true
    strip_whitespace: true
    min_chunk_size: 128
