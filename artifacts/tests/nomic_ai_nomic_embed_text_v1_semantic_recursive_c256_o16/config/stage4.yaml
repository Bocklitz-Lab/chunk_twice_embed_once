input_path: artifacts/chemquests_hf_db/full_text.jsonl
output_path: artifacts/tests/nomic_ai_nomic_embed_text_v1_semantic_recursive_c256_o16/chunks/chunks.jsonl
text_field: text
id_field: corpus_id
token_count_encoding: cl100k_base
token_count_model: null
compute_offsets: true
max_docs: null
strategy:
  name: semantic
  params:
    model_name: nomic-ai/nomic-embed-text-v1
    use_recursive: true
    chunk_size: 256
    chunk_overlap: 16
    breakpoint_threshold_type: percentile
    breakpoint_threshold_amount: 95
    buffer_size: 1
    add_start_index: true
    strip_whitespace: true
    min_chunk_size: 128
