input_path: artifacts/chemquests_hf_db/full_text.jsonl
output_path: artifacts/tests/hkunlp_instructor_xl_recursive_token_c320_o32/chunks/chunks.jsonl
text_field: text
id_field: corpus_id
token_count_encoding: cl100k_base
token_count_model: null
compute_offsets: true
max_docs: null
strategy:
  name: recursive_token
  params:
    chunk_size: 320
    chunk_overlap: 32
    separators:
    - '\n\n'
    - '\n'
    - .
    - '?'
    - '!'
    - ' '
    - ''
    keep_separator: true
    is_separator_regex: false
    model_name: hkunlp/instructor-xl
    add_start_index: false
    strip_whitespace: true
