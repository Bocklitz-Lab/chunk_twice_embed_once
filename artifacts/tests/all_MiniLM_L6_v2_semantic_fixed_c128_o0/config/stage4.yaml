input_path: artifacts/chemquests_hf_db/full_text.jsonl
output_path: artifacts/tests/all_MiniLM_L6_v2_semantic_fixed_c128_o0/chunks/chunks.jsonl
text_field: text
id_field: corpus_id
token_count_encoding: cl100k_base
token_count_model: null
compute_offsets: true
max_docs: null
strategy:
  name: semantic
  params:
    use_recursive: false
    embedding_provider: huggingface
    embedding_model: sentence-transformers/all-MiniLM-L6-v2
    chunk_size: 128
    chunk_overlap: 0
    breakpoint_threshold_type: percentile
    breakpoint_threshold_amount: 95
    buffer_size: 1
    add_start_index: true
